name: Release

# A Gateway tag only promotes the image built for its commit on main (workflow Image): it
# stamps the version and the backup runner, signs the digest and publishes the release.
# Main CI already ran the light suite on the commit; stable tags add the backup-runner smoke.
on:
  push:
    tags:
      - 'v*'
      - '!v*-wiolett.*'

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/gateway

jobs:
  gateway:
    name: Gateway release
    if: >-
      ${{ !(endsWith(github.ref_name, '-relay') || endsWith(github.ref_name, '-nginx') ||
      endsWith(github.ref_name, '-docker') || endsWith(github.ref_name, '-monitoring') ||
      endsWith(github.ref_name, '-watchdog')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve tag
        id: tag
        run: |
          # The annotated tag carries the release notes.
          git fetch --no-tags --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          scripts/release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" >> "$GITHUB_OUTPUT"
          echo "runner_tree=$(git rev-parse "${GITHUB_REF_NAME}^{commit}:packages/daemons/backup-runner")" >> "$GITHUB_OUTPUT"

      - name: Require a Gateway tag
        env:
          RELEASE_KIND: ${{ steps.tag.outputs.kind }}
        run: test "$RELEASE_KIND" = gateway

      - name: Verify product continuity grant
        run: node scripts/verify-continuity-grant.mjs

      - name: Require successful main CI
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          run_id=$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")][0].id // empty'
          )
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run exists for ${SHA}" >&2
            exit 1
          fi
          echo "Main CI run ${run_id} passed for ${SHA}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.4'
          cache-dependency-path: packages/daemons/go.work.sum

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Wait for the commit's images
        id: images
        env:
          SHA: ${{ steps.tag.outputs.sha }}
          RUNNER_TREE: ${{ steps.tag.outputs.runner_tree }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest'
          }
          base="${GATEWAY_IMAGE}:main-${SHA}"
          runner="${GATEWAY_IMAGE}/backup-runner:tree-${RUNNER_TREE}"
          for attempt in $(seq 1 120); do
            if base_digest=$(digest_of "$base") && runner_digest=$(digest_of "$runner"); then
              echo "base=${GATEWAY_IMAGE}@${base_digest}" >> "$GITHUB_OUTPUT"
              echo "runner=${GATEWAY_IMAGE}/backup-runner@${runner_digest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            failed=$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/image.yml/runs?head_sha=${SHA}&per_page=20" \
                --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion != "success")] | length'
            )
            ongoing=$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/image.yml/runs?head_sha=${SHA}&per_page=20" \
                --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length'
            )
            if [[ "$failed" != 0 && "$ongoing" == 0 ]]; then
              echo "::error::Workflow Image failed for ${SHA}; rerun it, then this release" >&2
              exit 1
            fi
            echo "Waiting for ${base} and ${runner} (${attempt})"
            sleep 10
          done
          echo "::error::Images for ${SHA} did not appear within 20 minutes" >&2
          exit 1

      - name: Stamp and push the release image
        id: image
        env:
          BASE_IMAGE: ${{ steps.images.outputs.base }}
          RUNNER_IMAGE: ${{ steps.images.outputs.runner }}
          RELEASE_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          context="${RUNNER_TEMP}/stamp"
          mkdir -p "$context"
          node scripts/bundle-backup-runner.mjs "$GITHUB_REF_NAME" "$RUNNER_IMAGE" "${context}/backup-runner-image.json"
          tags=(--tag "${GATEWAY_IMAGE}:${GITHUB_REF_NAME}" --tag "${GATEWAY_IMAGE}:${GITHUB_REF_NAME#v}")
          if [[ "$RELEASE_PRERELEASE" != "true" ]]; then
            tags+=(--tag "${GATEWAY_IMAGE}:latest")
          fi
          docker buildx build \
            --file docker/release.Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "APP_VERSION=${GITHUB_REF_NAME}" \
            "${tags[@]}" \
            --provenance=false \
            --sbom=false \
            --metadata-file "${RUNNER_TEMP}/image.metadata.json" \
            --push "$context"
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${RUNNER_TEMP}/image.metadata.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "${GATEWAY_IMAGE}/backup-runner:${GITHUB_REF_NAME}" "$RUNNER_IMAGE"
          echo "Published ${GATEWAY_IMAGE}@${digest}"

      - name: Smoke-test the bundled backup runner
        if: ${{ steps.tag.outputs.prerelease != 'true' }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          RUNNER_IMAGE: ${{ steps.images.outputs.runner }}
        run: node scripts/test-backup-runner-release.mjs "${GATEWAY_IMAGE}@${DIGEST}" "$RUNNER_IMAGE"

      - name: Sign update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          test -n "${UPDATE_SIGNING_PRIVATE_KEY_PEM_B64}" || {
            echo 'UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 is required' >&2
            exit 1
          }
          ./scripts/sync-update-trust-anchor.sh
          (
            cd packages/daemons
            go run ./shared/cmd/update-trust sign \
              --kind gateway-image \
              --version "$GITHUB_REF_NAME" \
              --tag "$GITHUB_REF_NAME" \
              --image "$GATEWAY_IMAGE" \
              --digest "$DIGEST" \
              --git-commit-sha "$SHA" \
              --git-pipeline-id "$GITHUB_RUN_ID" \
              --out ../../gateway-image.update.json
          )

      - name: Publish GitHub release
        env:
          RELEASE_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            printf 'Gateway release %s\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            args=(--title "Gateway ${GITHUB_REF_NAME}" --notes-file release-notes.md)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--prerelease=false)
            fi
            gh release edit "$GITHUB_REF_NAME" "${args[@]}"
          else
            args=(--draft --verify-tag --title "Gateway ${GITHUB_REF_NAME}" --notes-file release-notes.md)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
          installers=(setup-daemon.sh setup-node.sh setup-docker-node.sh setup-database-node.sh setup-storage-node.sh setup-monitoring-node.sh)
          (cd scripts && sha256sum "${installers[@]}") > gateway-daemon-installers.sha256
          assets=(CONTINUITY-MIT-GRANT.md gateway-image.update.json gateway-daemon-installers.sha256)
          for installer in "${installers[@]}"; do
            assets+=("scripts/${installer}")
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<<"$uploaded"
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false

      # Packages the commercial core against this exact release; the license server installs it
      # once packaged. Needs COMMERCIAL_CI_TOKEN (actions:write on the commercial repository).
      - name: Package the commercial core
        if: ${{ steps.tag.outputs.prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.COMMERCIAL_CI_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::COMMERCIAL_CI_TOKEN is not set; dispatch the commercial release by hand"
            exit 0
          fi
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY_OWNER}/gateway-commercial" \
            --ref main \
            -f "host_ref=${GITHUB_REF_NAME}" \
            -f "host_version=${GITHUB_REF_NAME}" \
            -f publish=true

  component-release:
    name: Component release
    if: >-
      ${{ endsWith(github.ref_name, '-relay') || endsWith(github.ref_name, '-nginx') ||
      endsWith(github.ref_name, '-docker') || endsWith(github.ref_name, '-monitoring') ||
      endsWith(github.ref_name, '-watchdog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require successful main CI
        run: |
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          run_id=$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")][0].id // empty'
          )
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run exists for ${sha}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.4'
          cache-dependency-path: |
            packages/daemons/go.work.sum
            packages/relay/go.sum

      - name: Build, sign, publish, and release component
        run: scripts/github-release.sh
