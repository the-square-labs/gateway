name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-wiolett.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
      UPDATE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.4'
          cache-dependency-path: |
            packages/daemons/go.work.sum
            packages/relay/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and publish
        run: scripts/github-release.sh
