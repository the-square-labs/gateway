syntax = "proto3";

package relay.v1;

option go_package = "github.com/wiolett-industries/gateway/daemon-shared/relayv1";

// TunnelBroker is deliberately resource agnostic. Gateway is the only
// component that maps endpoint and route identifiers to product resources.
service TunnelBroker {
  rpc RegisterEndpoint(stream EndpointControl) returns (stream EndpointControl);
  rpc OpenTunnel(stream TunnelFrame) returns (stream TunnelFrame);
  rpc AcceptTunnel(stream TunnelFrame) returns (stream TunnelFrame);
}

// RelayAdmin is reachable on the same listener but only by the pinned Gateway
// app service identity.
service RelayAdmin {
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc GetRouteRuntime(RouteRuntimeRequest) returns (RouteRuntimeResponse);
  rpc ApplySnapshot(ApplySnapshotRequest) returns (ApplySnapshotResponse);
  rpc BootstrapPolicyTrust(BootstrapPolicyTrustRequest) returns (BootstrapPolicyTrustResponse);
  rpc ReloadIdentity(ReloadIdentityRequest) returns (ReloadIdentityResponse);
  rpc CommitIdentityRotation(CommitIdentityRotationRequest) returns (CommitIdentityRotationResponse);
  rpc SetDrain(SetDrainRequest) returns (SetDrainResponse);
}

message SignedGrant {
  string key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message EndpointControl {
  oneof payload {
    RegisterEndpoint register = 1;
    RenewEndpoint renew = 2;
    EndpointRegistered registered = 3;
    IncomingTunnel incoming = 4;
    RelayError error = 5;
  }
}

message RegisterEndpoint { SignedGrant grant = 1; }
message RenewEndpoint { SignedGrant grant = 1; }
message EndpointRegistered {
  string endpoint_id = 1;
  int64 grant_expires_at_unix = 2;
}
message IncomingTunnel {
  string session_id = 1;
  string accept_token = 2;
  int64 accept_expires_at_unix = 3;
}

message TunnelFrame {
  oneof payload {
    OpenTunnel open = 1;
    AcceptTunnel accept = 2;
    TunnelReady ready = 3;
    TunnelData data = 4;
    TunnelHalfClose half_close = 5;
    TunnelClose close = 6;
    RelayError error = 7;
  }
}

message OpenTunnel { SignedGrant grant = 1; }
message AcceptTunnel { string accept_token = 1; }
message TunnelReady { uint32 max_frame_bytes = 1; }
message TunnelData { bytes data = 1; }
message TunnelHalfClose {}
message TunnelClose {}
message RelayError {
  string code = 1;
  string message = 2;
}

message PublicKey {
  string key_id = 1;
  bytes public_key = 2;
}

enum RelayMode {
  RELAY_MODE_UNSPECIFIED = 0;
  RELAY_MODE_LOCAL_COMBINED = 1;
  RELAY_MODE_REMOTE_DATA_ONLY = 2;
}

message PolicySigningKey {
  string key_id = 1;
  bytes public_key = 2;
  string public_key_fingerprint = 3;
  string status = 4; // "active" or "verification_only"
  int64 valid_from_unix = 5;
  int64 verify_until_unix = 6;
}

message EndpointPolicy {
  string endpoint_id = 1;
  uint64 generation = 2;
  string subject_kind = 3;
  string subject_id = 4;
  string certificate_sha256 = 5;
  uint32 max_concurrent_sessions = 6;
  string pool_id = 7;
  string relay_instance_id = 8;
  uint64 assignment_generation = 9;
}

message RoutePolicy {
  string route_id = 1;
  uint64 generation = 2;
  string source_kind = 3;
  string source_id = 4;
  string source_certificate_sha256 = 5;
  string target_endpoint_id = 6;
  uint32 max_concurrent_sessions = 7;
  uint32 max_frame_bytes = 8;
  // Proxy Secure Links intentionally have no fixed idle timeout. Existing
  // routes keep the relay default when this field is false.
  bool disable_idle_timeout = 9;
  // Product classification used only for overload admission and reporting.
  // The relay remains unaware of concrete Gateway resource identifiers.
  string traffic_class = 10;
  uint64 assignment_generation = 11;
}

message AdmissionPolicy {
  bool enabled = 1;
  uint32 proxy_target_pressure_percent = 2;
  uint32 database_reserve_percent = 3;
  uint32 hard_pressure_percent = 4;
}

message PolicyEnvelopePayload {
  uint32 schema_version = 1;
  string gateway_instance_id = 2;
  string pool_id = 3;
  string relay_instance_id = 4;
  uint64 revision = 5;
  int64 issued_at_unix = 6;
  int64 expires_at_unix = 7;
  repeated PublicKey grant_public_keys = 8;
  repeated EndpointPolicy endpoints = 9;
  repeated RoutePolicy routes = 10;
  AdmissionPolicy admission_policy = 11;
  repeated string capabilities = 12;
  repeated PolicySigningKey policy_signing_keys = 13;
}

message SignedPolicyEnvelope {
  string signing_key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message ApplySnapshotRequest {
  uint64 revision = 1;
  string gateway_instance_id = 2;
  repeated PublicKey public_keys = 3;
  repeated EndpointPolicy endpoints = 4;
  repeated RoutePolicy routes = 5;
  AdmissionPolicy admission_policy = 6;
  // Pool-aware relays consume this signed envelope. Legacy local callers keep
  // fields 1-6 byte-for-field compatible until capability negotiation succeeds.
  SignedPolicyEnvelope signed_envelope = 7;
}

message ApplySnapshotResponse {
  uint64 applied_revision = 1;
  bool unchanged = 2;
  string pool_id = 3;
  string relay_instance_id = 4;
  int64 policy_expires_at_unix = 5;
}

message BootstrapPolicyTrustRequest {
  string key_id = 1;
  bytes public_key = 2;
  string public_key_fingerprint = 3;
}
message BootstrapPolicyTrustResponse {
  string key_id = 1;
  string public_key_fingerprint = 2;
  bool unchanged = 3;
}

message HealthRequest {}
message HealthResponse {
  string build_version = 1;
  uint32 protocol_major = 2;
  uint64 applied_revision = 3;
  repeated string key_ids = 4;
  uint64 registered_endpoints = 5;
  uint64 active_tunnels = 6;
  bool liveness = 7;
  bool readiness = 8;
  string reason = 9;
  uint64 active_proxy_tunnels = 10;
  uint64 active_database_tunnels = 11;
  uint64 throttled_proxy_total = 12;
  uint64 throttled_database_total = 13;
  uint32 pressure_percent = 14;
  uint32 cpu_pressure_percent = 15;
  uint32 memory_pressure_percent = 16;
  uint32 fd_pressure_percent = 17;
  string admission_state = 18;
  uint64 memory_rss_bytes = 19;
  uint64 heap_in_use_bytes = 20;
  uint64 memory_limit_bytes = 21;
  uint64 open_file_descriptors = 22;
  uint64 file_descriptor_limit = 23;
  string pool_id = 24;
  string relay_instance_id = 25;
  RelayMode mode = 26;
  int64 policy_expires_at_unix = 27;
  repeated string capabilities = 28;
  bool draining = 29;
  repeated AssignmentTunnelCount assignment_tunnels = 30;
  repeated string policy_key_ids = 31;
}

message AssignmentTunnelCount {
  string endpoint_id = 1;
  uint64 assignment_generation = 2;
  uint64 active_tunnels = 3;
}

message RouteRuntimeRequest { string route_id = 1; }
message RouteRuntimeResponse {
  string route_id = 1;
  uint64 active_tunnels = 2;
  uint64 opened_total = 3;
  uint64 completed_total = 4;
  uint64 failed_total = 5;
  uint64 throttled_total = 6;
  uint64 source_to_target_bytes = 7;
  uint64 target_to_source_bytes = 8;
  uint64 setup_latency_p95_microseconds = 9;
  uint64 average_duration_milliseconds = 10;
  int64 last_activity_unix_milliseconds = 11;
  int64 metrics_since_unix_milliseconds = 12;
}

message ReloadIdentityRequest { string operation_id = 1; }
message ReloadIdentityResponse { bool reloaded = 1; }
message CommitIdentityRotationRequest { string operation_id = 1; }
message CommitIdentityRotationResponse { bool committed = 1; }
message SetDrainRequest {
  bool draining = 1;
  string operation_id = 2;
  bool force_disconnect = 3;
}
message SetDrainResponse {
  bool draining = 1;
  uint64 disconnected_tunnels = 2;
}
