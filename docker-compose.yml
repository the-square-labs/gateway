services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE_REF:-gateway:local}
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      com.wiolett.gateway.managed-service: app
    ports:
      - "3000:3000"
    expose:
      - "9443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_CONNECTOR_IMAGE=${DATABASE_CONNECTOR_IMAGE:-}
      - SECURE_LINK_CONNECTOR_IMAGE=${SECURE_LINK_CONNECTOR_IMAGE:-}
      - DATABASE_URL=postgres://gateway:${DB_PASSWORD}@postgres:5432/gateway
      - REDIS_URL=redis://redis:6379
      - GITHUB_OAUTH_CLIENT_ID
      - SETUP_BOOTSTRAP=${SETUP_BOOTSTRAP:-false}
      - WEB_TLS_BOOTSTRAP_MODE=${WEB_TLS_BOOTSTRAP_MODE:-http}
      - WEB_TLS_AUTO_DIR=${WEB_TLS_AUTO_DIR:-/var/lib/gateway/tls}
      - PKI_MASTER_KEY=${PKI_MASTER_KEY}
      - HEALTH_CHECK_INTERVAL_SECONDS=${HEALTH_CHECK_INTERVAL_SECONDS:-30}
      - ACME_RENEWAL_CRON=${ACME_RENEWAL_CRON:-0 3 * * *}
      - EXPIRY_CHECK_CRON=${EXPIRY_CHECK_CRON:-0 6 * * *}
      - GRPC_PORT=${GRPC_PORT:-9443}
      - GRPC_TLS_AUTO_DIR=${GRPC_TLS_AUTO_DIR:-/var/lib/gateway/tls}
      - SANDBOX_RUNNER_WORKSPACE_DIR=${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/gateway/sandbox-workspaces}
      - GRPC_TLS_CERT=${GRPC_TLS_CERT:-}
      - GRPC_TLS_KEY=${GRPC_TLS_KEY:-}
      - GRPC_TLS_EXTRA_SANS=${GRPC_TLS_EXTRA_SANS:-}
      - GATEWAY_RELAY_REQUIRED=${GATEWAY_RELAY_REQUIRED:-true}
      - GATEWAY_RELAY_MANAGED=${GATEWAY_RELAY_MANAGED:-false}
      - GATEWAY_RELAY_TARGET=${GATEWAY_RELAY_TARGET:-relay:9443}
      - GATEWAY_RELAY_IDENTITY_DIR=/var/lib/gateway-relay
      - GATEWAY_RELAY_IMAGE_REF=${GATEWAY_RELAY_IMAGE_REF:-gateway-relay:local}
      - GATEWAY_RELAY_SERVICE_NAME=relay
      - GATEWAY_RELAY_BUILD_VERSION=${GATEWAY_RELAY_BUILD_VERSION:-dev}
      - GATEWAY_RELAY_PROTOCOL_MAJOR=${GATEWAY_RELAY_PROTOCOL_MAJOR:-1}
      - GATEWAY_REGISTRY_AUTH_DIR=/var/lib/gateway-registry-auth
      - PUBLIC_IPV4=${PUBLIC_IPV4:-}
      - PUBLIC_IPV6=${PUBLIC_IPV6:-}
      - APP_VERSION=${GATEWAY_VERSION:-dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway_data:/var/lib/gateway
      - gateway_relay_identity:/var/lib/gateway-relay
      - gateway_registry_auth:/var/lib/gateway-registry-auth
      # gateway-managed:start sandbox-workspace
      - ${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/gateway/sandbox-workspaces}:${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/gateway/sandbox-workspaces}
      # gateway-managed:end sandbox-workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:3000/health || wget -qO- http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  relay:
    image: ${GATEWAY_RELAY_IMAGE_REF:-gateway-relay:local}
    entrypoint: ["/gateway-relay"]
    restart: unless-stopped
    labels:
      com.wiolett.gateway.managed-service: relay
    environment:
      - RELAY_IDENTITY_DIR=/var/lib/gateway-relay/identity
      - RELAY_STATE_DIR=/var/lib/gateway-relay/state
      - RELAY_APP_GRPC_TARGET=app:9443
      - RELAY_POOL_ID=system
      - RELAY_INSTANCE_ID=00000000-0000-4000-8000-000000000001
    ports:
      - "9443:9443"
    volumes:
      - gateway_relay_identity:/var/lib/gateway-relay/identity:ro
      - gateway_relay_state:/var/lib/gateway-relay/state
    healthcheck:
      test: ["CMD", "/gateway-relay", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s

  registry:
    image: ${GATEWAY_REGISTRY_IMAGE_REF:-registry:3}
    restart: unless-stopped
    labels:
      com.wiolett.gateway.managed-service: registry
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_DEBUG_ADDR: 127.0.0.1:5001
      REGISTRY_HTTP_SECRET: ${GATEWAY_REGISTRY_HTTP_SECRET:-gateway-development-registry-secret}
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: ${GATEWAY_REGISTRY_TOKEN_REALM:-https://gateway.invalid/api/docker/registry/token}
      REGISTRY_AUTH_TOKEN_SERVICE: gateway-internal-registry
      REGISTRY_AUTH_TOKEN_ISSUER: gateway-internal-registry
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /var/lib/gateway-registry-auth/token-cert.pem
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_INTERVAL: 10s
      REGISTRY_HEALTH_STORAGEDRIVER_THRESHOLD: "3"
    expose:
      - "5000"
    volumes:
      - gateway_registry_data:/var/lib/registry
      - gateway_registry_auth:/var/lib/gateway-registry-auth:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/debug/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gateway_data:
  gateway_relay_identity:
  gateway_relay_state:
  gateway_registry_data:
  gateway_registry_auth:
  postgres_data:
  redis_data:
