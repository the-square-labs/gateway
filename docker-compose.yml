services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE_REF:-gateway:local}
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      com.wiolett.gateway.managed-service: app
    ports:
      - "3000:3000"
    expose:
      - "9443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_CONNECTOR_IMAGE=${DATABASE_CONNECTOR_IMAGE:-}
      - SECURE_LINK_CONNECTOR_IMAGE=${SECURE_LINK_CONNECTOR_IMAGE:-}
      - DATABASE_URL=postgres://gateway:${DB_PASSWORD}@postgres:5432/gateway
      - REDIS_URL=redis://redis:6379
      - LOGGING_INGEST_MAX_BODY_BYTES=${LOGGING_INGEST_MAX_BODY_BYTES:-1048576}
      - LOGGING_INGEST_MAX_BATCH_SIZE=${LOGGING_INGEST_MAX_BATCH_SIZE:-500}
      - LOGGING_INGEST_MAX_MESSAGE_BYTES=${LOGGING_INGEST_MAX_MESSAGE_BYTES:-16384}
      - LOGGING_INGEST_MAX_LABELS=${LOGGING_INGEST_MAX_LABELS:-32}
      - LOGGING_INGEST_MAX_FIELDS=${LOGGING_INGEST_MAX_FIELDS:-64}
      - LOGGING_INGEST_MAX_KEY_LENGTH=${LOGGING_INGEST_MAX_KEY_LENGTH:-100}
      - LOGGING_INGEST_MAX_VALUE_BYTES=${LOGGING_INGEST_MAX_VALUE_BYTES:-8192}
      - LOGGING_INGEST_MAX_JSON_DEPTH=${LOGGING_INGEST_MAX_JSON_DEPTH:-5}
      - LOGGING_RATE_LIMIT_WINDOW_SECONDS=${LOGGING_RATE_LIMIT_WINDOW_SECONDS:-60}
      - LOGGING_GLOBAL_REQUESTS_PER_WINDOW=${LOGGING_GLOBAL_REQUESTS_PER_WINDOW:-600}
      - LOGGING_GLOBAL_EVENTS_PER_WINDOW=${LOGGING_GLOBAL_EVENTS_PER_WINDOW:-60000}
      - LOGGING_TOKEN_REQUESTS_PER_WINDOW=${LOGGING_TOKEN_REQUESTS_PER_WINDOW:-300}
      - LOGGING_TOKEN_EVENTS_PER_WINDOW=${LOGGING_TOKEN_EVENTS_PER_WINDOW:-10000}
      - SESSION_EXPIRY=${SESSION_EXPIRY:-2592000}
      - GITHUB_OAUTH_CLIENT_ID
      - SETUP_BOOTSTRAP=${SETUP_BOOTSTRAP:-false}
      - WEB_TLS_BOOTSTRAP_MODE=${WEB_TLS_BOOTSTRAP_MODE:-http}
      - WEB_TLS_AUTO_DIR=${WEB_TLS_AUTO_DIR:-/var/lib/gateway/tls}
      - PKI_MASTER_KEY=${PKI_MASTER_KEY}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-1200}
      - RATE_LIMIT_AUTH_MAX_REQUESTS=${RATE_LIMIT_AUTH_MAX_REQUESTS:-120}
      - RATE_LIMIT_AUTH_LOGIN_MAX_REQUESTS=${RATE_LIMIT_AUTH_LOGIN_MAX_REQUESTS:-20}
      - RATE_LIMIT_AUTH_CALLBACK_MAX_REQUESTS=${RATE_LIMIT_AUTH_CALLBACK_MAX_REQUESTS:-60}
      - RATE_LIMIT_SETUP_MAX_REQUESTS=${RATE_LIMIT_SETUP_MAX_REQUESTS:-20}
      - RATE_LIMIT_PUBLIC_STATUS_MAX_REQUESTS=${RATE_LIMIT_PUBLIC_STATUS_MAX_REQUESTS:-600}
      - RATE_LIMIT_PUBLIC_WEBHOOK_MAX_REQUESTS=${RATE_LIMIT_PUBLIC_WEBHOOK_MAX_REQUESTS:-60}
      - RATE_LIMIT_PKI_MAX_REQUESTS=${RATE_LIMIT_PKI_MAX_REQUESTS:-600}
      - RATE_LIMIT_STREAM_MAX_REQUESTS=${RATE_LIMIT_STREAM_MAX_REQUESTS:-120}
      - RATE_LIMIT_AI_WS_MAX_REQUESTS=${RATE_LIMIT_AI_WS_MAX_REQUESTS:-120}
      - DEFAULT_CRL_VALIDITY_HOURS=${DEFAULT_CRL_VALIDITY_HOURS:-24}
      - DEFAULT_OCSP_VALIDITY_MINUTES=${DEFAULT_OCSP_VALIDITY_MINUTES:-60}
      - EXPIRY_WARNING_DAYS=${EXPIRY_WARNING_DAYS:-30}
      - EXPIRY_CRITICAL_DAYS=${EXPIRY_CRITICAL_DAYS:-7}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - ACME_STAGING=${ACME_STAGING:-false}
      - HEALTH_CHECK_INTERVAL_SECONDS=${HEALTH_CHECK_INTERVAL_SECONDS:-30}
      - ACME_RENEWAL_CRON=${ACME_RENEWAL_CRON:-0 3 * * *}
      - EXPIRY_CHECK_CRON=${EXPIRY_CHECK_CRON:-0 6 * * *}
      - GRPC_PORT=${GRPC_PORT:-9443}
      - GRPC_TLS_AUTO_DIR=${GRPC_TLS_AUTO_DIR:-/var/lib/gateway/tls}
      - SANDBOX_RUNNER_WORKSPACE_DIR=${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/gateway/sandbox-workspaces}
      - GRPC_TLS_CERT=${GRPC_TLS_CERT:-}
      - GRPC_TLS_KEY=${GRPC_TLS_KEY:-}
      - GRPC_TLS_EXTRA_SANS=${GRPC_TLS_EXTRA_SANS:-}
      - GATEWAY_RELAY_REQUIRED=${GATEWAY_RELAY_REQUIRED:-true}
      - GATEWAY_RELAY_MANAGED=${GATEWAY_RELAY_MANAGED:-false}
      - GATEWAY_RELAY_TARGET=${GATEWAY_RELAY_TARGET:-relay:9443}
      - GATEWAY_RELAY_IDENTITY_DIR=/var/lib/gateway-relay
      - GATEWAY_RELAY_IMAGE_REF=${GATEWAY_RELAY_IMAGE_REF:-gateway-relay:local}
      - GATEWAY_RELAY_SERVICE_NAME=relay
      - GATEWAY_RELAY_BUILD_VERSION=${GATEWAY_RELAY_BUILD_VERSION:-dev}
      - GATEWAY_RELAY_PROTOCOL_MAJOR=${GATEWAY_RELAY_PROTOCOL_MAJOR:-1}
      - PUBLIC_IPV4=${PUBLIC_IPV4:-}
      - PUBLIC_IPV6=${PUBLIC_IPV6:-}
      - APP_VERSION=${GATEWAY_VERSION:-dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway_data:/var/lib/gateway
      - gateway_relay_identity:/var/lib/gateway-relay
      # gateway-managed:start sandbox-workspace
      - ${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/gateway/sandbox-workspaces}:${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/gateway/sandbox-workspaces}
      # gateway-managed:end sandbox-workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:3000/health || wget -qO- http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  relay:
    image: ${GATEWAY_RELAY_IMAGE_REF:-gateway-relay:local}
    entrypoint: ["/gateway-relay"]
    restart: unless-stopped
    labels:
      com.wiolett.gateway.managed-service: relay
    environment:
      - RELAY_IDENTITY_DIR=/var/lib/gateway-relay/identity
      - RELAY_STATE_DIR=/var/lib/gateway-relay/state
      - RELAY_APP_GRPC_TARGET=app:9443
      - RELAY_POOL_ID=system
      - RELAY_INSTANCE_ID=00000000-0000-4000-8000-000000000001
    ports:
      - "9443:9443"
    volumes:
      - gateway_relay_identity:/var/lib/gateway-relay/identity:ro
      - gateway_relay_state:/var/lib/gateway-relay/state
    healthcheck:
      test: ["CMD", "/gateway-relay", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gateway_data:
  gateway_relay_identity:
  gateway_relay_state:
  postgres_data:
  redis_data:
